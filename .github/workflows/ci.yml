name: Fleet CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy ruff black

      - name: Lint with Ruff and Black
        run: |
          ruff check src/ tests/
          black --check src/ tests/

      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v

      - name: Run Headless Benchmarks
        run: |
          python scripts/benchmark_stop_and_wait.py
          python scripts/benchmark_framework.py
          python scripts/compare_benchmarks.py

  ros2-colcon-build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop-full
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            python3-pip \
            python3-colcon-common-extensions \
            ros-humble-gazebo-ros-pkgs \
            ros-humble-rosbridge-suite \
            ros-humble-nav2-msgs \
            ros-humble-xacro \
            ros-humble-rmw-cyclonedds-cpp
          pip3 install pytest pyyaml numpy

      - name: Build Colcon Workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          mkdir -p /root/ros2_ws/src
          cp -r src/* /root/ros2_ws/src/
          cd /root/ros2_ws
          colcon build --symlink-install

      - name: Run Colcon Tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd /root/ros2_ws
          source install/setup.bash
          colcon test --packages-select amr_fleet amr_description amr_worlds
          colcon test-result --verbose
